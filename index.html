<title>Лила</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout concept: a single vertical phone-width app — status header,
     the board as the visual centerpiece with the token floating on it,
     a dice card, and a fixed bottom tab bar, matching a real Telegram
     Mini App's structure so this can be dropped into one later. */
  :root{
    --bg:#efe2c2;
    --panel:#e7d6ac;
    --panel-2:#ddc994;
    --line:rgba(59,42,21,0.18);
    --ink:#2c2013;
    --ink-soft:#5a4a34;
    --gold:#a4741f;
    --gold-strong:#7d5713;
    --violet:#5d4a8a;
    --violet-soft:#a394c9;
    --shadow:0 10px 30px rgba(44,32,19,0.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#171009;
      --panel:#241a10;
      --panel-2:#2d2013;
      --line:rgba(233,214,167,0.14);
      --ink:#f1e6d2;
      --ink-soft:#c9b795;
      --gold:#e0ac4f;
      --gold-strong:#f0c777;
      --violet:#b7a4e6;
      --violet-soft:#7a6bab;
      --shadow:0 10px 30px rgba(0,0,0,0.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171009;
    --panel:#241a10;
    --panel-2:#2d2013;
    --line:rgba(233,214,167,0.14);
    --ink:#f1e6d2;
    --ink-soft:#c9b795;
    --gold:#e0ac4f;
    --gold-strong:#f0c777;
    --violet:#b7a4e6;
    --violet-soft:#7a6bab;
    --shadow:0 10px 30px rgba(0,0,0,0.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,sans-serif;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding-inline:16px;
  }

  /* ---------- header ---------- */
  header.top{
    padding-block:18px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:"Cinzel",serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.06em;
    margin:0;
    background:linear-gradient(120deg,var(--gold-strong),var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand span.tag{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .status{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .status .label{
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    flex:1;
    height:6px;
    border-radius:99px;
    background:var(--panel-2);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .bar > i{
    display:block;
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--violet),var(--gold));
    transition:width .5s cubic-bezier(.4,0,.2,1);
    width:0%;
  }

  /* ---------- board ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-block:4px 14px;
    min-width:0;
  }
  .board{
    position:relative;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    line-height:0;
  }
  .board img{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
    user-select:none;
    -webkit-user-drag:none;
  }
  .token{
    position:absolute;
    width:6.6%;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));
    transition:left .32s cubic-bezier(.34,1.3,.64,1), top .32s cubic-bezier(.34,1.3,.64,1), opacity .3s ease;
    opacity:0;
    pointer-events:none;
    will-change:left, top;
  }
  .token img{width:100%;display:block}
  .token.hop{ animation:hop .32s ease }
  @keyframes hop{
    0%{transform:translate(-50%,-50%) scale(1)}
    40%{transform:translate(-50%,-62%) scale(1.06)}
    100%{transform:translate(-50%,-50%) scale(1)}
  }

  /* ---------- dice card ---------- */
  .dice-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow:var(--shadow);
  }
  .die{
    --s:56px;
    width:var(--s);
    height:var(--s);
    flex:0 0 auto;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:8px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
  }
  .die .pip{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--gold-strong);
    justify-self:center;
    align-self:center;
    opacity:0;
    transform:scale(.4);
    transition:opacity .12s, transform .12s;
  }
  .die.show .pip.on{opacity:1;transform:scale(1)}
  .die.rolling{animation:shake .5s ease}
  @keyframes shake{
    0%,100%{transform:rotate(0)}
    20%{transform:rotate(-14deg)}
    40%{transform:rotate(11deg)}
    60%{transform:rotate(-8deg)}
    80%{transform:rotate(6deg)}
  }
  .dice-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .dice-info .roll-caption{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.35;
  }
  .roll-btn{
    appearance:none;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.01em;
    color:#2c2013;
    background:linear-gradient(180deg,var(--gold),var(--gold-strong));
    padding:11px 16px;
    border-radius:12px;
    box-shadow:0 4px 0 var(--gold-strong), var(--shadow);
    flex:0 0 auto;
  }
  .roll-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--gold-strong);
  }
  .roll-btn:disabled{opacity:.55}
  :root[data-theme="dark"] .roll-btn, @media (prefers-color-scheme:dark){ }

  /* ---------- bottom nav ---------- */
  nav.tabs{
    position:sticky;
    bottom:0;
    display:flex;
    gap:6px;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(var(--bg) 40%, var(--bg));
    border-top:1px solid var(--line);
  }
  nav.tabs button{
    appearance:none;
    border:none;
    background:transparent;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px 6px;
    border-radius:12px;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    letter-spacing:.01em;
  }
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.active{color:var(--gold-strong);background:var(--panel)}
  nav.tabs button.active svg{stroke:var(--gold-strong)}
  nav.tabs button:active{transform:scale(.96)}

  /* ---------- sheet ---------- */
  .sheet-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,14,7,.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:5;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(16px);
    transition:transform .25s cubic-bezier(.34,1.2,.64,1);
    box-shadow:0 -10px 30px rgba(0,0,0,.25);
  }
  .sheet-backdrop.open .sheet{transform:translateY(0)}
  .sheet h2{
    font-family:"Cinzel",serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 8px;
    color:var(--ink);
  }
  .sheet p{
    margin:0;
    font-size:14px;
    line-height:1.55;
    color:var(--ink-soft);
  }
  .sheet .close{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    padding:9px 14px;
    border-radius:10px;
    margin-top:16px;
  }

  @media (prefers-reduced-motion:reduce){
    .token{transition:none}
    .die.rolling{animation:none}
    .token.hop{animation:none}
  }

  .conn-banner{
    background:#7a2222;
    color:#fff;
    font-size:12.5px;
    padding:8px 12px;
    border-radius:10px;
    margin-top:10px;
    line-height:1.4;
  }
  #sheetBody{font-size:14px;line-height:1.55;color:var(--ink-soft)}
  #sheetBody p{margin:0 0 10px}
  #sheetBody .q{color:var(--ink);font-style:italic;margin-top:10px}
  #sheetBody textarea{
    width:100%;
    min-height:90px;
    font-family:inherit;
    font-size:14px;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    resize:vertical;
    margin-top:10px;
    box-sizing:border-box;
  }
  #sheetBody .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  #sheetBody .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    padding:10px 14px;
    border-radius:10px;
  }
  #sheetBody .btn:disabled{opacity:.55}
  #sheetBody .btn.primary{
    background:linear-gradient(180deg,var(--gold),var(--gold-strong));
    color:#2c2013;
    border:none;
  }
  #sheetBody .muted{color:var(--ink-soft)}
  #sheetBody .entry{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  #sheetBody .entry:last-child{border-bottom:none}
  #sheetBody .entry .meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px}
  #sheetBody .entry .text{color:var(--ink)}
</style>

    1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]
  };

  // Постоянный адрес API бота. Поднимается на компьютере вместе с ботом и
  // становится виден из интернета через туннель с постоянным доменом — см.
  // раздел «Мини-апп» в документе «Как запустить бота». Если этот адрес
  // когда-нибудь сменится — его нужно поменять здесь и обновить мини-апп
  // (см. там же, «Если понадобится обновить мини-апп»).
  var API_BASE = "https://macbook-air--dariyns.tail37281d.ts.net";

  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = (tg && tg.initData) || "";
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
  }

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function wait(ms) { return new Promise(function (r) { setTimeout(r, reduceMotion ? 0 : ms); }); }

  var tokenEl = document.getElementById("token");
  var dieEl = document.getElementById("die");
  var rollBtn = document.getElementById("rollBtn");
  var rollCaption = document.getElementById("rollCaption");
  var cellLabel = document.getElementById("cellLabel");
  var progressBar = document.getElementById("progressBar");
  var connBanner = document.getElementById("connBanner");

  function showBanner(text) {
    connBanner.textContent = text;
    connBanner.hidden = false;
  }
  function hideBanner() { connBanner.hidden = true; }

  // ---------------- API ----------------
  function apiGet(path) {
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    return fetch(API_BASE + path + sep + "init_data=" + encodeURIComponent(initData))
      .then(function (res) {
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      });
  }
  function apiPost(path, body) {
    body = body || {};
    body.init_data = initData;
    return fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    });
  }

  // ---------------- die ----------------
  function buildDie() {
    dieEl.innerHTML = "";
    for (var i = 1; i <= 9; i++) {
      var pip = document.createElement("div");
      pip.className = "pip";
      pip.dataset.pos = String(i);
      dieEl.appendChild(pip);
    }
  }
  function showFace(n) {
    var positions = PIP_LAYOUT[n] || [];
    var pips = dieEl.querySelectorAll(".pip");
    pips.forEach(function (p) {
      p.classList.toggle("on", positions.indexOf(parseInt(p.dataset.pos, 10)) >= 0);
    });
    dieEl.classList.add("show");
  }

  // ---------------- token / board ----------------
  function setTokenCell(cell, animateHop) {
    if (cell < 1) { tokenEl.style.opacity = "0"; return; }
    var c = COORDS[String(cell)];
    if (!c) return;
    tokenEl.style.left = (c[0] / BOARD_W * 100) + "%";
    tokenEl.style.top = (c[1] / BOARD_H * 100) + "%";
    tokenEl.style.opacity = "1";
    if (animateHop) {
      tokenEl.classList.remove("hop");
      void tokenEl.offsetWidth;
      tokenEl.classList.add("hop");
    }
  }
  function updateStatus(cell, entered) {
    if (!entered) {
      cellLabel.textContent = "вне поля";
      progressBar.style.width = "0%";
      return;
    }
    cellLabel.textContent = "клетка " + cell + " / " + TOTAL_CELLS;
    progressBar.style.width = ((cell / TOTAL_CELLS) * 100) + "%";
  }
  async function walkPath(path) {
    for (var i = 0; i < path.length; i++) {
      if (i > 0) await wait(320);
      setTokenCell(path[i], true);
    }
  }

  // Те же сообщения о переброске при шестёрках, что в чате бота — см.
  // _intermediate_messages в src/handlers/game.py.
  function intermediateMessages(rolls) {
    var msgs = [];
    var streak = 0;
    for (var i = 0; i < rolls.length - 1; i++) {
      if (rolls[i] === 6) {
        streak++;
        msgs.push(streak === 3 ? "🔥 Три шестёрки подряд сгорают. Бросаем ещё раз." : "🎲 Выпало 6! Переброс.");
      }
    }
    return msgs;
  }
  async function animateRolls(rolls) {
    dieEl.classList.add("rolling");
    await wait(260);
    dieEl.classList.remove("rolling");
    for (var i = 0; i < rolls.length; i++) {
      showFace(Math.min(rolls[i], 6));
      if (i < rolls.length - 1) await wait(260);
    }
  }

  // ---------------- sheet (общее модальное окно) ----------------
  var sheetBackdrop = document.getElementById("sheetBackdrop");
  var sheetTitle = document.getElementById("sheetTitle");
  var sheetBody = document.getElementById("sheetBody");
  var sheetClose = document.getElementById("sheetClose");
  var tabButtons = document.querySelectorAll("nav.tabs button");

  function el(tag, opts) {
    var e = document.createElement(tag);
    opts = opts || {};
    if (opts.cls) e.className = opts.cls;
    if (opts.text !== undefined) e.textContent = opts.text;
    return e;
  }

  function openSheet(title) {
    sheetTitle.textContent = title;
    sheetBody.innerHTML = "";
    sheetBackdrop.classList.add("open");
  }
  function closeSheet() {
    sheetBackdrop.classList.remove("open");
    setActiveTab("dice");
  }
  function setActiveTab(tab) {
    tabButtons.forEach(function (b) {
      b.classList.toggle("active", b.dataset.tab === tab);
    });
  }

  sheetClose.addEventListener("click", closeSheet);
  sheetBackdrop.addEventListener("click", function (e) {
    if (e.target === sheetBackdrop) closeSheet();
  });

  // ---------------- клетка + отклик ----------------
  function renderCellCard(cell, resultText, canReflect) {
    openSheet(cell.name);
    if (resultText) sheetBody.appendChild(el("p", { cls: "muted", text: resultText }));
    sheetBody.appendChild(el("p", { text: cell.description }));
    if (cell.question) sheetBody.appendChild(el("p", { cls: "q", text: "❓ " + cell.question }));
    if (canReflect) renderReflectionForm();
  }

  function renderReflectionForm() {
    sheetBody.appendChild(el("p", { cls: "muted", text: "Как хочешь оставить отклик на эту клетку?" }));

    var textarea = document.createElement("textarea");
    textarea.placeholder = "Можно написать здесь — или оставить при себе.";
    sheetBody.appendChild(textarea);

    var row = el("div", { cls: "row" });
    var saveBtn = el("button", { cls: "btn primary", text: "Сохранить в дневник" });
    var skipBtn = el("button", { cls: "btn", text: "🤐 Оставить при себе" });
    row.appendChild(saveBtn);
    row.appendChild(skipBtn);
    sheetBody.appendChild(row);

    saveBtn.addEventListener("click", function () {
      var text = textarea.value.trim();
      if (!text) return;
      saveBtn.disabled = true;
      skipBtn.disabled = true;
      apiPost("/api/reflection", { choice: "text", text: text }).then(function () {
        hideBanner();
        sheetBody.innerHTML = "";
        sheetBody.appendChild(el("p", { text: "📝 Записала в дневник." }));
      }).catch(function () {
        showBanner("Не получилось сохранить — проверь связь с ботом.");
        saveBtn.disabled = false;
        skipBtn.disabled = false;
      });
    });
    skipBtn.addEventListener("click", function () {
      saveBtn.disabled = true;
      skipBtn.disabled = true;
      apiPost("/api/reflection", { choice: "skip" }).then(function () {
        hideBanner();
        sheetBody.innerHTML = "";
        sheetBody.appendChild(el("p", { text: "Хорошо, это останется только с тобой. 🤍" }));
      }).catch(function () {
        showBanner("Не получилось — проверь связь с ботом.");
        saveBtn.disabled = false;
        skipBtn.disabled = false;
      });
    });
  }

  function renderQuestionForm() {
    openSheet("Твой вопрос к игре");
    sheetBody.appendChild(el("p", { text: "🎉 Игра началась! Ты родился в игре!" }));
    sheetBody.appendChild(el("p", {
      cls: "muted",
      text: "Напиши свой вопрос — точно в той формулировке, которую выбрал. Он должен быть открытым, не «да/нет»."
    }));
    var textarea = document.createElement("textarea");
    textarea.placeholder = "Например: что мне важно понять про...";
    sheetBody.appendChild(textarea);
    var row = el("div", { cls: "row" });
    var sendBtn = el("button", { cls: "btn primary", text: "Отправить" });
    row.appendChild(sendBtn);
    sheetBody.appendChild(row);
    sendBtn.addEventListener("click", function () {
      var text = textarea.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      apiPost("/api/question", { text: text }).then(function (data) {
        hideBanner();
        sheetBody.innerHTML = "";
        sheetBody.appendChild(el("p", { text: "📝 Записала твой вопрос." }));
        setTimeout(function () {
          renderCellCard(data.cell, null, data.can_reflect);
        }, 450);
      }).catch(function () {
        showBanner("Не получилось сохранить — проверь связь с ботом.");
        sendBtn.disabled = false;
      });
    });
  }

  function renderIntro(text) {
    openSheet("Правила игры «Лила»");
    text.split("\n\n").forEach(function (p) {
      sheetBody.appendChild(el("p", { text: p }));
    });
  }

  // ---------------- бросок кубика ----------------
  var rolling = false;
  async function rollDice() {
    if (rolling) return;
    rolling = true;
    rollBtn.disabled = true;
    try {
      var data = await apiPost("/api/roll", {});
      hideBanner();

      if (data.phase === "intro") {
        renderIntro(data.text);
        return;
      }

      await animateRolls(data.rolls || []);
      var msgs = intermediateMessages(data.rolls || []);
      for (var i = 0; i < msgs.length; i++) {
        rollCaption.textContent = msgs[i];
        await wait(500);
      }

      if (data.phase === "no_entry") {
        rollCaption.textContent = data.result_text;
        return;
      }

      if (data.phase === "need_question") {
        setTokenCell(data.cell, true);
        updateStatus(data.cell, true);
        rollCaption.textContent = data.result_text;
        renderQuestionForm();
        return;
      }

      // data.phase === "landed"
      await walkPath(data.path && data.path.length ? data.path : [data.cell.number]);
      updateStatus(data.cell.number, true);
      rollCaption.textContent = data.result_text;
      renderCellCard(data.cell, null, data.can_reflect);
    } catch (err) {
      showBanner("Нет связи с ботом. Проверь, что бот и туннель запущены на компьютере.");
    } finally {
      rolling = false;
      rollBtn.disabled = false;
    }
  }
  rollBtn.addEventListener("click", rollDice);

  // ---------------- дневник ----------------
  function renderDiary(entries) {
    sheetBody.innerHTML = "";
    if (!entries.length) {
      sheetBody.appendChild(el("p", { cls: "muted", text: "Пока дневник пуст. Попади на клетку и оставь первый отклик." }));
      return;
    }
    entries.forEach(function (entry) {
      var item = el("div", { cls: "entry" });
      item.appendChild(el("div", { cls: "meta", text: (entry.date || "") + " · " + (entry.cell_name || "") }));
      if (entry.format === "text" && entry.answer_text) {
        item.appendChild(el("div", { cls: "text", text: entry.answer_text }));
      } else if (entry.format === "voice") {
        item.appendChild(el("div", { cls: "text muted", text: "🎤 голосовая запись — послушать можно в Telegram, в «Моём дневнике»" }));
        if (entry.voice_transcript) {
          item.appendChild(el("div", { cls: "text", text: "Распознано: " + entry.voice_transcript }));
        }
      }
      sheetBody.appendChild(item);
    });
  }

  // ---------------- оракул ----------------
  function renderOracleIntro() {
    openSheet("Оракул");
    sheetBody.appendChild(el("p", { text: "🔮 Сформулируй свой вопрос — или просто подумай о том, что тебя сейчас тревожит." }));
    var row = el("div", { cls: "row" });
    var readyBtn = el("button", { cls: "btn primary", text: "✅ Я готов(а)" });
    row.appendChild(readyBtn);
    sheetBody.appendChild(row);
    readyBtn.addEventListener("click", function () {
      readyBtn.disabled = true;
      apiPost("/api/oracle", {}).then(function (data) {
        hideBanner();
        sheetBody.innerHTML = "";
        sheetBody.appendChild(el("p", { cls: "q", text: data.label }));
        sheetBody.appendChild(el("p", { text: data.text }));
      }).catch(function () {
        showBanner("Не получилось связаться с оракулом — проверь связь с ботом.");
        readyBtn.disabled = false;
      });
    });
  }

  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var tab = btn.dataset.tab;
      if (tab === "dice") { setActiveTab("dice"); return; }
      setActiveTab(tab);
      if (tab === "diary") {
        openSheet("Твой дневник");
        sheetBody.appendChild(el("p", { cls: "muted", text: "Загружаю…" }));
        apiGet("/api/diary").then(function (data) {
          hideBanner();
          renderDiary(data.entries || []);
        }).catch(function () {
          sheetBody.innerHTML = "";
          sheetBody.appendChild(el("p", { cls: "muted", text: "Не удалось загрузить дневник — проверь связь с ботом." }));
        });
      } else if (tab === "oracle") {
        renderOracleIntro();
      }
    });
  });

  // ---------------- старт ----------------
  buildDie();
  (async function boot() {
    if (!initData) {
      showBanner("Открой мини-игру кнопкой в боте, чтобы она увидела, кто играет.");
    }
    try {
      var state = await apiGet("/api/state");
      setTokenCell(state.cell, false);
      updateStatus(state.cell, state.entered);
      rollCaption.textContent = state.entered
        ? ("Сейчас вы на клетке " + state.cell + " из " + TOTAL_CELLS + ".")
        : "Нажмите «Бросить», чтобы попытаться войти в игру — нужна шестёрка.";
      if (initData) hideBanner();
    } catch (err) {
      updateStatus(0, false);
      showBanner("Нет связи с ботом. Проверь, что бот и туннель запущены на компьютере.");
    }
  })();
})();
</script>
